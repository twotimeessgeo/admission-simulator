<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>정시 지원</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./design-system/index.css">
  <link rel="stylesheet" href="./app.css">
  <script src="./pages_api.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="tw-nav is-static">
    <div class="tw-nav-inner">
      <span class="tw-brand" lang="en">twotimess</span>
      <span class="tw-nav-spacer"></span>
      <span id="edition-badge" class="tw-badge"></span>
      <button id="open-settings" class="icon-btn" type="button" aria-label="설정" title="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.4 7.4 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4.9 2-3.4Z"/></svg></button>
    </div>
  </header>

  <div class="tw-subnav app-subnav">
    <div class="tw-subnav-inner">
      <nav class="tw-segmented app-tabs" aria-label="화면">
        <button type="button" data-view="overview" class="is-active">성적 분석</button>
        <button type="button" data-view="find">대학 찾기</button>
        <button type="button" data-view="list">모의지원</button>
      </nav>
      <button id="score-strip" class="score-strip" type="button" aria-label="성적 수정"></button>
    </div>
  </div>

  <main class="tw-page app-main">
    <div id="offline" class="tw-empty" hidden>
      <strong>계산기를 불러오지 못했습니다.</strong>
      <span>새로고침 후에도 계속되면 인터넷 연결을 확인해 주세요.</span>
    </div>
    <div id="error" class="app-error" role="alert" hidden></div>

    <div id="empty" class="start" hidden>
      <h1 class="tw-sr-only">성적 입력</h1>
      <form id="quick" class="composer" novalidate>
        <div id="quick-fields" class="composer-fields"></div>
        <div class="composer-foot">
          <div id="quick-group" class="tw-segmented">
            <button type="button" data-group="H" class="is-active">문과</button>
            <button type="button" data-group="S">이과</button>
          </div>
          <button id="quick-dice" class="icon-btn composer-dice" type="button" aria-label="예시 성적" title="예시 성적"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.1" class="pip"/><circle cx="15" cy="9" r="1.1" class="pip"/><circle cx="12" cy="12" r="1.1" class="pip"/><circle cx="9" cy="15" r="1.1" class="pip"/><circle cx="15" cy="15" r="1.1" class="pip"/></svg></button>
          <span id="quick-status" class="composer-status" aria-live="polite">표준점수</span>
          <button id="quick-send" class="composer-send" type="submit" aria-label="결과 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </form>
      <div class="start-chips">
        <button id="start-raw" class="tw-chip" type="button">원점수로 입력</button>
      </div>
    </div>

    <div id="loading" class="loading" hidden>
      <div class="loading-head">
        <div class="loading-bar"><i id="loading-fill"></i></div>
        <p id="loading-text">성적을 계산하고 있습니다.</p>
      </div>
      <div class="skeleton" aria-hidden="true">
        <div class="sk-col"><i class="sk sk-title"></i><i class="sk sk-card"></i><i class="sk sk-title"></i><i class="sk sk-chart"></i></div>
        <div class="sk-col"><i class="sk sk-title"></i><i class="sk sk-list"></i></div>
      </div>
    </div>

    <section id="view-overview" class="view" hidden>
      <div class="overview-top">
        <section class="block ot-report">
          <div class="block-head"><h2>성적표</h2></div>
          <div class="report-card tw-card">
            <div id="report-info" class="report-meta"></div>
            <div id="report" class="tw-table-wrap report-wrap"></div>
          </div>
        </section>
        <section class="block ot-conv">
          <div class="block-head">
            <h2>대학별 환산점수</h2>
            <div id="conv-tab" class="tw-segmented">
              <button type="button" data-tab="med">메디컬</button>
              <button type="button" data-tab="S">자연계</button>
              <button type="button" data-tab="H">인문계</button>
            </div>
          </div>
          <div class="conv tw-card">
            <div class="conv-legend"><span class="lg-me">나</span><span class="lg-line">합격선</span></div>
            <div id="conv-list" class="conv-list"></div>
          </div>
        </section>
        <section class="block ot-pos">
          <div class="block-head">
            <h2>내 위치</h2>
            <div class="block-controls">
              <div id="group-switch" class="tw-segmented">
                <button type="button" data-group="H">문과</button>
                <button type="button" data-group="S">이과</button>
                <button type="button" data-group="A">전체</button>
              </div>
              <div id="basis-switch" class="tw-segmented">
                <button type="button" data-basis="std">표준점수 합</button>
                <button type="button" data-basis="pct">백분위 합</button>
              </div>
            </div>
          </div>
          <div class="position tw-card">
            <div class="position-head">
              <div class="tw-stat"><span class="tw-stat-label" id="pos-label"></span><span class="pos-value" id="pos-pct"></span></div>
              <div class="tw-stat"><span class="tw-stat-label">등수</span><span class="tw-stat-value" id="pos-rank"></span></div>
              <div class="tw-stat"><span class="tw-stat-label" id="pos-score-label"></span><span class="tw-stat-value" id="pos-score"></span></div>
            </div>
            <div id="position-chart" class="position-chart"></div>
          </div>
        </section>
      </div>

      <section class="block">
        <div class="block-head"><h2>군별 추천</h2><div class="tier-legend" aria-hidden="true"><span data-tier="safe">안정</span><span data-tier="fit">적정</span><span data-tier="reach">소신</span></div></div>
        <div id="rec-category" class="chip-row"></div>
        <div id="recs" class="rounds"></div>
      </section>
    </section>

    <section id="view-find" class="view" hidden>
      <div class="find-bar">
        <label class="tw-search find-search"><input id="find-query" class="tw-input" type="search" placeholder="대학 또는 학과" autocomplete="off" aria-label="검색"></label>
        <div id="find-round" class="tw-segmented">
          <button type="button" data-round="" class="is-active">전체</button>
          <button type="button" data-round="가">가</button>
          <button type="button" data-round="나">나</button>
          <button type="button" data-round="다">다</button>
        </div>
      </div>
      <div class="find-sub"><div id="find-category" class="chip-row"></div><div class="tier-legend" aria-hidden="true"><span data-tier="safe">안정</span><span data-tier="fit">적정</span><span data-tier="reach">소신</span></div></div>
      <div id="find-list" class="line-list"></div>
    </section>

    <section id="view-list" class="view" hidden>
      <div class="block-head"><h2>모의지원</h2></div>
      <div id="list-summary" class="combo"></div>
      <div id="list-rounds" class="rounds"></div>
    </section>
  </main>

  <nav class="tab-bar" aria-label="화면">
    <button type="button" data-view="overview" class="is-active">성적 분석</button>
    <button type="button" data-view="find">대학 찾기</button>
    <button type="button" data-view="list">모의지원</button>
  </nav>

  <div id="scrim" class="scrim" hidden></div>

  <section id="sheet-input" class="sheet" role="dialog" aria-modal="true" aria-labelledby="input-title" hidden>
    <header class="sheet-head">
      <h2 id="input-title">성적</h2>
      <span class="sheet-head-actions"><button id="input-dice" class="icon-btn composer-dice" type="button" aria-label="예시 성적" title="예시 성적"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.1" class="pip"/><circle cx="15" cy="9" r="1.1" class="pip"/><circle cx="12" cy="12" r="1.1" class="pip"/><circle cx="9" cy="15" r="1.1" class="pip"/><circle cx="15" cy="15" r="1.1" class="pip"/></svg></button>
      <button class="icon-btn" type="button" data-close aria-label="닫기" title="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
    </header>
    <div class="sheet-body">
      <div id="input-mode" class="tw-segmented sheet-switch">
        <button type="button" data-mode="std" class="is-active">표준점수</button>
        <button type="button" data-mode="raw">원점수</button>
      </div>
      <div id="input-form" class="score-form"></div>
      <div class="field-row">
        <span class="field-name">지역인재</span>
        <select id="input-region" class="tw-select field-select" aria-label="지역인재"></select>
      </div>
    </div>
    <footer class="sheet-foot">
      <button id="input-reset" class="tw-button is-ghost is-sm" type="button">처음 화면</button>
      <span id="input-status" class="sheet-status"></span>
      <button id="input-apply" class="tw-button is-primary" type="button">적용</button>
    </footer>
  </section>

  <section id="sheet-detail" class="sheet is-wide" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <header class="sheet-head">
      <div class="detail-title-row">
        <span id="detail-mono" class="mono is-lg"></span>
        <div>
          <p id="detail-uni" class="detail-uni"></p>
          <h2 id="detail-title"></h2>
        </div>
      </div>
      <div class="detail-actions">
        <button id="detail-fav" class="fav" type="button" aria-label="담기"></button>
        <button class="icon-btn" type="button" data-close aria-label="닫기" title="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <div id="detail-body" class="sheet-body"></div>
  </section>

  <section id="sheet-settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <header class="sheet-head">
      <h2 id="settings-title">설정</h2>
      <button class="icon-btn" type="button" data-close aria-label="닫기" title="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div id="settings-body" class="sheet-body"></div>
  </section>
</body>
</html>
